const NEWS=[{id:3,d:'08.10.2026',title:'Конкурс чтецов Корана',t:'Студенты 3 курса заняли первое место в республиканском конкурсе чтецов Корана. Поздравляем победителей и их наставников.',img:SVGP('#5B332B','#8A5244','Конкурс чтецов Корана'),by:'Секретарь Ахмедов Т. Р.'},{id:2,d:'05.10.2026',title:'Родительское собрание 17 октября',t:'Приглашаем родителей студентов всех курсов 17 октября в 10:00 в актовый зал. Расскажем об итогах сентября и ответим на вопросы.',img:null,by:'Ректор'},{id:1,d:'01.10.2026',title:'Начались дополнительные занятия по арабскому языку',t:'Для студентов 1 и 2 курсов открыты дополнительные занятия по арабскому языку. Занятия проходят после обеда, запись у куратора группы.',img:SVGP('#8F6518','#D9AE5C','Арабский язык'),by:'Зам по учебной части'}];
const canNews=()=>['rector','zam','sekr'].includes(st.role);
const newsCard=(n,full,ed)=>`<div class="panel" style="padding:0;overflow:hidden">${n.img?`<img src="${n.img}" alt="" style="width:100%;max-height:190px;object-fit:cover;display:block">`:''}<div style="padding:12px 14px 14px"><small class="muted">${n.d}</small><div style="font-weight:700;font-size:17px;margin:2px 0 6px">${esc(n.title)}</div><div>${esc(full||n.t.length<130?n.t:n.t.slice(0,120).replace(/\s+\S*$/,'')+'…')}</div>${ed?`<div class="btns"><small class="muted" style="align-self:center">Опубликовал(а): ${esc(n.by)}</small>${(st.role==='rector'||n.by===who())?`<button class="btn ghost small" data-act="newsdel" data-id="${n.id}">Удалить</button>`:''}</div>`:''}</div></div>`;
const newsHome=()=>NEWS.length?`<h2>Новости университета</h2>${NEWS.slice(0,2).map(n=>newsCard(n)).join('')}<div class="btns"><button class="btn ghost" data-act="newsall">Все новости: ${NEWS.length}</button></div>`:'';
